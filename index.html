<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1b5aa0">
  <title>Mis listas</title>
  <style>
    :root{color-scheme:light;--text:#000;--muted:#5a5a5a;--blue:#1e3287;--link:#0066cc}
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;font:14px/1.4 "Segoe UI","Segoe UI Web",Tahoma,"Noto Sans",system-ui,sans-serif;color:var(--text);
      background:
        radial-gradient(120% 60% at 20% 105%,rgba(160,225,255,.75),transparent 55%),
        radial-gradient(70% 50% at 85% 0%,rgba(80,170,255,.55),transparent 60%),
        conic-gradient(from 200deg at 15% 100%,transparent 0 8deg,rgba(255,255,255,.12) 10deg 14deg,transparent 16deg 24deg,rgba(255,255,255,.08) 26deg 31deg,transparent 33deg),
        linear-gradient(160deg,#2a7fd4 0%,#1557a6 45%,#0a3470 100%);
      background-attachment:fixed;padding:24px 12px 48px}

    /* ---------- Ventana Aero ---------- */
    .window{width:min(820px,100%);margin:0 auto;border-radius:8px;padding:0 7px 7px;
      background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.25) 40px,rgba(150,195,235,.45));
      border:1px solid rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.65),0 10px 40px rgba(0,0,0,.45);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:open .35s cubic-bezier(.2,.9,.3,1)}
    @keyframes open{from{opacity:0;transform:scale(.92)}}
    .titlebar{display:flex;align-items:center;gap:8px;height:30px;padding-left:4px}
    .titlebar .appicon{width:18px;height:18px;flex:none}
    .titlebar h1{margin:0;font-size:13px;font-weight:400;color:#000;text-shadow:0 0 10px #fff,0 0 10px #fff,0 0 6px #fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .caption{display:flex;align-self:flex-start;border:1px solid rgba(0,0,0,.5);border-top:0;border-radius:0 0 5px 5px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.6)}
    .caption span{width:27px;height:19px;display:grid;place-items:center;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.2) 50%,rgba(255,255,255,.05) 51%,rgba(255,255,255,.3));border-left:1px solid rgba(0,0,0,.35);color:#fff;font-size:11px;font-weight:700;text-shadow:0 0 2px #000,0 0 3px #000}
    .caption span:first-child{border-left:0}
    .caption .close{width:46px;background:linear-gradient(#e7a39a,#d4705f 50%,#c4402b 51%,#d86e4f);transition:box-shadow .2s,filter .2s}
    .caption .close:hover{filter:brightness(1.15);box-shadow:0 0 10px 2px rgba(255,90,60,.8)}

    .body{background:#fff;border:1px solid #6a85a6;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
    .header{padding:16px 18px 10px;background:linear-gradient(#fff,#f3f7fb);border-bottom:1px solid #dfe8f1}
    .header h2{margin:0;color:var(--blue);font-size:20px;font-weight:400}
    .content{padding:16px 18px;display:grid;gap:14px}

    /* ---------- Cuadros de grupo ---------- */
    fieldset{margin:0;border:1px solid #d5dfe5;border-radius:3px;padding:10px 12px 12px;min-width:0}
    legend{padding:0 4px;color:var(--blue)}
    .out{display:grid;gap:4px}
    .out + .out{margin-top:12px}
    .out b{font-weight:600}
    .out small{color:var(--muted)}
    .out-row{display:flex;gap:6px;align-items:stretch}
    .field{flex:1;min-width:0;border:1px solid;border-color:#abadb3 #dbdfe6 #e3e9ef #e2e3ea;background:#fff;padding:4px 6px;font-size:13px;word-break:break-all;user-select:all;color:#000;border-radius:2px}
    .fixed{display:flex;flex-wrap:wrap;gap:8px 28px}
    .fixed div{display:flex;align-items:center;gap:7px}
    .fixed b{font-weight:600}
    .fixed small{color:var(--muted)}
    .check{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(#5fd35f,#2a9d2a);border:1px solid #237a23}
    .sources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}

    /* ---------- Pestañas ---------- */
    .tabs{display:flex;gap:0;padding-left:2px;position:relative;z-index:1}
    .tabs button{font:inherit;font-size:13px;color:#000;margin-right:-1px;padding:3px 12px;border:1px solid #898c95;border-bottom:0;border-radius:3px 3px 0 0;
      background:linear-gradient(#f2f2f2,#ebebeb 50%,#dddddd 51%,#cfcfcf);cursor:pointer;margin-top:2px;transition:background .15s}
    .tabs button:hover:not(.active){background:linear-gradient(#eaf6fd,#d9f0fc 50%,#bee6fd 51%,#a7d9f5);border-color:#3c7fb1}
    .tabs button.active{background:#fff;margin-top:0;padding-bottom:6px;margin-bottom:-1px;position:relative;z-index:2}
    .panel{border:1px solid #898c95;background:#fff;padding:10px;border-radius:0 2px 2px 2px}

    /* ---------- Campos ---------- */
    textarea,input[type=password]{width:100%;font:inherit;font-size:13px;color:#000;background:#fff;border:1px solid;border-color:#abadb3 #dbdfe6 #e3e9ef #e2e3ea;border-radius:2px;padding:4px 6px;outline:none;transition:border-color .2s}
    textarea:hover,input[type=password]:hover{border-color:#5794bf #b7d5ea #c7e2f1 #c5daed}
    textarea:focus,input[type=password]:focus{border-color:#3d7bad #a4c9e3 #b7d9ed #b5cfe7}
    textarea{resize:vertical;min-height:150px;line-height:1.35}
    textarea.url{min-height:0;resize:none;overflow:hidden;word-break:break-all}
    .drop{display:grid;place-items:center;gap:6px;text-align:center;min-height:150px;padding:14px;border:1px dashed #9aa8b8;border-radius:3px;background:linear-gradient(#fbfdff,#eef4fa);color:var(--muted);font-size:13px;cursor:pointer;transition:background .2s,border-color .2s}
    .drop:hover{border-color:#3c7fb1;background:linear-gradient(#f5fbff,#e1f0fb)}
    .drop.drag{border-style:solid;border-color:#3d7bad;background:#d9effc}
    .drop svg{width:40px;height:40px}
    .drop b{color:#000;font-weight:600}
    .file-row{display:flex;gap:6px;margin-top:8px}
    .file-row .field{user-select:text;color:var(--muted)}
    .file-row .field.has{color:#000}
    .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;color:var(--muted);font-size:13px}
    .hidden{display:none!important}
    .token-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;flex-wrap:wrap}
    .token-row label{display:flex;align-items:center;gap:5px;cursor:pointer}
    .token-row a{margin-left:auto;color:var(--link)}
    a{color:var(--link)}a:hover{color:#3399ff}

    /* ---------- Botones Windows 7 ---------- */
    .btn{font:inherit;font-size:13px;color:#000;min-width:76px;min-height:25px;padding:2px 12px;cursor:pointer;border:1px solid #707070;border-radius:3px;
      background:linear-gradient(#f2f2f2 0%,#ebebeb 49%,#dddddd 50%,#cfcfcf 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);
      transition:background .2s,border-color .2s,box-shadow .2s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
    .btn:hover{border-color:#3c7fb1;background:linear-gradient(#eaf6fd 0%,#d9f0fc 49%,#bee6fd 50%,#a7d9f5 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 0 6px rgba(60,160,230,.45)}
    .btn:active{border-color:#2c628b;background:linear-gradient(#e5f4fc 0%,#c4e5f6 49%,#98d1ef 50%,#68b3db 100%);box-shadow:inset 1px 1px 2px rgba(0,0,0,.3);transition:none}
    .btn:focus-visible{outline:1px dotted #000;outline-offset:-4px}
    .btn:disabled{color:#838383;border-color:#adb2b5;background:#f4f4f4;box-shadow:none;cursor:default}
    .btn.default{border-color:#3c7fb1;animation:glow 1.6s ease-in-out infinite alternate}
    @keyframes glow{from{box-shadow:inset 0 0 0 1px #fff,inset 0 0 0 2px rgba(64,180,240,.35)}to{box-shadow:inset 0 0 0 1px #fff,inset 0 0 0 2px rgba(64,180,240,.95),0 0 5px rgba(64,180,240,.5)}}
    .btn.default:disabled{animation:none}
    .btn.done{border-color:#3c8a3c;background:linear-gradient(#ecf9e6,#d6f0c8 49%,#b8e6a0 50%,#9fd884)}
    .btn.big{font-size:14px;padding:5px 22px;min-height:32px}
    .btn.icon{min-width:0;padding:2px 8px}

    /* ---------- Barra de progreso ---------- */
    .progress{height:15px;border:1px solid #b2b2b2;border-radius:3px;background:linear-gradient(#f3f3f3,#e6e6e6);overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px #fff}
    .progress::before{content:"";position:absolute;inset:1px;width:45%;border-radius:2px;background:linear-gradient(#37dc4b,#0db227 50%,#08a320 51%,#3bd34c);animation:marquee 1.6s linear infinite}
    .progress::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);width:30%;animation:marquee 1.1s linear infinite}
    @keyframes marquee{from{left:-45%}to{left:100%}}

    /* ---------- Mensajes ---------- */
    .msg{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;background:#ffffe1;border:1px solid #e8d77a;font-size:13px}
    .msg::before{content:"!";flex:none;width:16px;height:16px;border-radius:50%;background:linear-gradient(#ffd75e,#e8a400);color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center;margin-top:1px}
    .msg.bad{background:#fde7e7;border-color:#e2a0a0}
    .msg.bad::before{content:"✕";background:linear-gradient(#f07a6a,#c22a16)}
    .msg:empty{display:none}

    .actions{display:flex;justify-content:flex-end;align-items:center;gap:10px}
    .actions .progress{flex:1}

    /* ---------- Barra de estado ---------- */
    .statusbar{display:flex;flex-wrap:wrap;align-items:center;gap:0;font-size:12px;color:#1e1e1e;border-top:1px solid #bccbdc;background:linear-gradient(#f1f6fb,#dbe6f3);padding:3px 6px}
    .statusbar span{padding:0 10px;border-left:1px solid #b9c9da}
    .statusbar span:first-child{border-left:0;padding-left:2px}
    .statusbar b{font-weight:600}
    .statusbar .grow{flex:1;border:0}
    .bump{animation:bump .5s}
    @keyframes bump{30%{color:#0b8a1f}}

    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
    @media(max-width:640px){body{padding:10px 6px 30px}.sources{grid-template-columns:1fr}.content{padding:10px 10px 14px}.header{padding:12px 12px 8px}.out-row{flex-wrap:wrap}.out-row .field{flex-basis:100%}.out-row .btn{flex:1}}
  </style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <svg class="appicon" viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#1667c4"/></linearGradient></defs><rect x="2" y="5" width="20" height="14" rx="2" fill="url(#g)" stroke="#0d3f80"/><rect x="4" y="7" width="16" height="10" rx="1" fill="#e8f4ff" opacity=".35"/><path d="M8 21h8" stroke="#0d3f80" stroke-width="2" stroke-linecap="round"/></svg>
    <h1>Mis listas</h1>
    <div class="caption" aria-hidden="true"><span>&#8211;</span><span>&#9633;</span><span class="close">&#10005;</span></div>
  </div>
  <div class="body">
    <div class="content">
      <fieldset>
        <legend>Listas publicadas</legend>
        <div id="outputs"></div>
      </fieldset>
      <div class="msg" id="message"></div>

      <fieldset>
        <legend>Listas fijas</legend>
        <div class="fixed">
          <div><span class="check">✓</span><b>SPORT TV</b><small data-fixed="SPORT TV (fija)"></small></div>
          <div><span class="check">✓</span><b>NEW LOOP</b><small data-fixed="NEW LOOP (fija)"></small></div>
        </div>
      </fieldset>

      <div class="sources" id="sources"></div>

      <fieldset id="token-box">
        <legend>Clave de GitHub</legend>
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
        <div class="token-row">
          <label><input id="remember" type="checkbox" checked> Recordar en este equipo</label>
          <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noreferrer">Crear clave</a>
        </div>
      </fieldset>

      <div class="actions">
        <div class="progress hidden" id="progress"></div>
        <button class="btn big default" id="publish">Juntar y publicar</button>
      </div>
    </div>
    <div class="statusbar" aria-live="polite">
      <span id="st-state">Cargando…</span>
      <span><b id="unique">—</b> canales</span>
      <span><b id="found">—</b> leídos</span>
      <span><b id="dupes">—</b> repetidos</span>
      <span class="grow"></span>
      <button class="btn icon" id="refresh" title="Actualizar">⟳ Actualizar</button>
    </div>
  </div>
</div>
<script>
const OWNER='ivanmi2005',REPO='crispy-robot',BRANCH='main';
const PAGES_BASE=`https://${OWNER}.github.io/${REPO}`;
const RAW_BASE=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;
const MAX_BYTES=950000;
const DEFAULT_URLS=['https://tokyo.elcano-ipfs.workers.dev/k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb/data/listas/lista_fuera_iptv.m3u','https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u'];
const OUTPUTS=[
  {name:'AceStream',hint:'para la app',file:'lista_acestream_unificada.m3u'},
  {name:'Motor local',hint:'para el ordenador',file:'lista_local_unificada.m3u'}
];
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
const fmtN=v=>v==null?'—':Number(v).toLocaleString('es-ES');

/* ---------- Listas de origen ---------- */
let saved=[];try{saved=JSON.parse(store.get('crispySources')||'[]')}catch{}
const state=[0,1].map(i=>({mode:['url','text','file'].includes(saved[i]?.mode)?saved[i].mode:'url',url:saved[i]?.url||DEFAULT_URLS[i],file:null,fileText:''}));
function saveSources(){store.set('crispySources',JSON.stringify(state.map(s=>({mode:s.mode,url:s.url}))))}
function countIds(text){const ids=new Set();for(const m of text.matchAll(/(?<![0-9a-f])([0-9a-f]{40})(?![0-9a-f])/gi))ids.add(m[1].toLowerCase());return ids.size}
function autosize(el){el.style.height='auto';el.style.height=el.scrollHeight+2+'px'}

$('#sources').innerHTML=state.map((s,i)=>`
  <fieldset data-i="${i}">
    <legend>Lista ${i+1}</legend>
    <div class="tabs" role="tablist"><button data-mode="url" role="tab">Enlace</button><button data-mode="text" role="tab">Texto</button><button data-mode="file" role="tab">Archivo</button></div>
    <div class="panel">
      <div data-panel="url"><textarea class="url" rows="1" spellcheck="false" placeholder="https://…/lista.m3u"></textarea></div>
      <div data-panel="text">
        <textarea class="list" spellcheck="false" placeholder="Pega aquí el contenido de la lista"></textarea>
        <div class="row"><span data-count>0 canales</span></div>
      </div>
      <div data-panel="file">
        <div class="drop" data-drop>
          <svg viewBox="0 0 48 48"><path d="M10 4h20l10 10v30H10z" fill="#fff" stroke="#6a85a6" stroke-width="2"/><path d="M30 4v10h10" fill="#dbe8f5" stroke="#6a85a6" stroke-width="2"/><rect x="15" y="22" width="20" height="3" fill="#8fb4dc"/><rect x="15" y="28" width="20" height="3" fill="#8fb4dc"/><rect x="15" y="34" width="13" height="3" fill="#8fb4dc"/></svg>
          <div><b>Arrastra aquí el archivo</b><br>o haz clic para elegirlo</div>
        </div>
        <div class="file-row"><div class="field" data-fname>Ningún archivo seleccionado</div><button class="btn" data-open>Examinar…</button></div>
        <div class="row"><span data-fcount></span></div>
        <input type="file" accept=".m3u,.m3u8,.txt,text/plain" hidden>
      </div>
    </div>
  </fieldset>`).join('');

document.querySelectorAll('[data-i]').forEach(box=>{
  const s=state[+box.dataset.i];
  const url=box.querySelector('textarea.url'),ta=box.querySelector('textarea.list'),file=box.querySelector('input[type=file]'),count=box.querySelector('[data-count]'),drop=box.querySelector('[data-drop]'),fname=box.querySelector('[data-fname]'),fcount=box.querySelector('[data-fcount]');
  const setMode=m=>{s.mode=m;box.querySelectorAll('.tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.mode===m);b.setAttribute('aria-selected',b.dataset.mode===m)});box.querySelectorAll('[data-panel]').forEach(p=>p.classList.toggle('hidden',p.dataset.panel!==m));if(m==='url')autosize(url);saveSources()};
  const canales=n=>`${fmtN(n)} canal${n===1?'':'es'}`;
  const updateCount=()=>{count.textContent=canales(countIds(ta.value))};
  const loadFile=async f=>{if(!f)return;s.file=f;s.fileText=await f.text();fname.textContent=`${f.name} (${Math.max(1,Math.round(f.size/1024))} KB)`;fname.classList.add('has');fcount.textContent=canales(countIds(s.fileText))};
  url.value=s.url;
  url.addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});
  url.addEventListener('input',()=>{url.value=url.value.replace(/\s+/g,'');s.url=url.value;autosize(url);saveSources()});
  box.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
  ta.addEventListener('input',updateCount);
  box.querySelector('[data-open]').addEventListener('click',()=>file.click());
  drop.addEventListener('click',()=>file.click());
  file.addEventListener('change',()=>{loadFile(file.files[0]);file.value=''});
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});
  drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');loadFile(e.dataTransfer.files[0])});
  s.textarea=ta;s.urlEl=url;setMode(s.mode);
});
window.addEventListener('resize',()=>state.forEach(s=>autosize(s.urlEl)));

/* ---------- Clave ---------- */
const tokenEl=$('#token'),rememberEl=$('#remember');
const savedToken=store.get('crispyGithubToken');
if(savedToken)tokenEl.value=savedToken;

/* ---------- Resultado ---------- */
function setState(text){$('#st-state').textContent=text}
function setMessage(text,kind='bad'){const m=$('#message');m.textContent=text||'';m.className=`msg ${kind}`}
function renderOutputs(){
  $('#outputs').innerHTML=OUTPUTS.map(o=>{const url=`${PAGES_BASE}/${o.file}`;return `
    <div class="out"><div><b>${o.name}</b> <small>— ${o.hint}</small></div>
      <div class="out-row"><div class="field">${url}</div>
        <button class="btn" data-copy="${url}">Copiar</button><a class="btn" href="${url}" target="_blank" rel="noreferrer" style="text-decoration:none;display:inline-grid;place-items:center">Abrir</a></div></div>`}).join('');
  $('#outputs').querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='✓ Copiado';b.classList.add('done')}catch{b.textContent='Error'}setTimeout(()=>{b.textContent='Copiar';b.classList.remove('done')},1500)}));
}
function fmtDate(iso){const d=new Date(iso);return isNaN(d)?'':d.toLocaleString('es-ES',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function renderStatus(st){
  [['#unique',st.total_unique],['#found',st.total_found],['#dupes',st.total_duplicates]].forEach(([id,v])=>{const el=$(id),t=fmtN(v);if(el.textContent!==t){el.textContent=t;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}});
  document.querySelectorAll('[data-fixed]').forEach(el=>{const src=(st.sources||[]).find(x=>x.label===el.dataset.fixed);el.textContent=src?`— ${fmtN(src.found)} canales`:''});
  if(st.ok){setState(`Actualizado: ${fmtDate(st.generated_at)}`);setMessage('')}
  else{setState('Error');setMessage(st.error||'El último proceso falló')}
}
async function fetchStatus(){
  const t=Date.now(),urls=[`${RAW_BASE}/published/status.json?t=${t}`,`${PAGES_BASE}/status.json?t=${t}`];
  const results=(await Promise.allSettled(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()))))
    .filter(r=>r.status==='fulfilled').map(r=>r.value);
  if(!results.length)throw new Error('Todavía no hay listas publicadas.');
  return results.sort((a,b)=>new Date(b.generated_at)-new Date(a.generated_at))[0];
}
async function loadStatus(){
  const btn=$('#refresh');btn.disabled=true;
  try{renderStatus(await fetchStatus())}catch(e){setState('Sin datos');setMessage(e.message)}
  finally{btn.disabled=false}
}

/* ---------- GitHub ---------- */
function toBase64(text){const bytes=new TextEncoder().encode(text);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin)}
async function github(path,options={}){
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{...options,headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${tokenEl.value.trim()}`,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}});
  if(!r.ok){let d='';try{d=(await r.json()).message||''}catch{}if(r.status===401)throw new Error('La clave de GitHub no es válida.');throw new Error(`GitHub ${r.status}${d?`: ${d}`:''}`)}
  return r.status===204?null:r.json();
}
async function currentSha(path){try{return(await github(`${path}?ref=${BRANCH}`)).sha}catch(e){if(e.message.startsWith('GitHub 404'))return null;throw e}}
async function upsert(path,content,message){const sha=await currentSha(path),body={message,content:toBase64(content),branch:BRANCH};if(sha)body.sha=sha;return github(path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}

async function poll(requestId){
  const start=Date.now();
  while(Date.now()-start<180000){
    await new Promise(r=>setTimeout(r,4000));
    try{const st=await fetchStatus();if(st.request_id===requestId||(!st.ok&&new Date(st.generated_at)>start)){renderStatus(st);return st.ok}}catch{}
  }
  setState('En curso…');setMessage('Está tardando un poco. Puedes cerrar la página: los enlaces se actualizarán solos.','info');
  return false;
}

async function publish(){
  const token=tokenEl.value.trim();
  if(!token){tokenEl.focus();setMessage('Falta la clave de GitHub.');return}
  store.set('crispyGithubToken',rememberEl.checked?token:null);
  const btn=$('#publish');btn.disabled=true;$('#progress').classList.remove('hidden');
  setState('Subiendo…');setMessage('');
  try{
    const sources=[];
    for(let i=0;i<2;i++){
      const s=state[i];
      if(s.mode==='url'){
        if(!/^https?:\/\//i.test(s.url))throw new Error(`El enlace de la lista ${i+1} no es válido.`);
        sources.push({label:`Lista ${i+1}`,type:'url',url:s.url,enabled:true});
      }else{
        if(s.mode==='file'&&!s.file)throw new Error(`Elige el archivo de la lista ${i+1}.`);
        const text=s.mode==='file'?s.fileText:s.textarea.value;
        if(!countIds(text))throw new Error(`La lista ${i+1} no tiene canales.`);
        if(new TextEncoder().encode(text).length>MAX_BYTES)throw new Error(`La lista ${i+1} es demasiado grande. Usa su enlace.`);
        const path=`web_sources/source_${i+1}.m3u`;
        await upsert(path,text.endsWith('\n')?text:text+'\n',`web: actualizar fuente ${i+1}`);
        sources.push({label:s.mode==='file'?s.file.name:`Texto ${i+1}`,type:'file',path,enabled:true});
      }
    }
    const requestId=`${Date.now()}-${crypto.randomUUID?.()||Math.random().toString(36).slice(2)}`;
    const request={request_id:requestId,requested_at:new Date().toISOString(),sources,outputs:{acestream:OUTPUTS[0].file,local:OUTPUTS[1].file}};
    await upsert('merge_request.json',JSON.stringify(request,null,2)+'\n','web: fusionar y publicar listas M3U');
    setState('Procesando…');
    await poll(requestId);
  }catch(e){setState('Error');setMessage(String(e.message||e))}
  finally{btn.disabled=false;$('#progress').classList.add('hidden')}
}

$('#publish').addEventListener('click',publish);
$('#refresh').addEventListener('click',loadStatus);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('#publish').disabled)loadStatus()});
renderOutputs();
loadStatus();
</script>
