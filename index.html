<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff6ef">
  <title>Mis listas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme:light;
      --bg:#fff6ef;--blob1:#ffd9c7;--blob2:#e9dcff;
      --card:#ffffff;--soft:#fbf1ea;--line:#f1e3d8;--text:#3a2a2a;--muted:#9a8580;
      --coral:#ff7a59;--pink:#ff5e8a;--violet:#8b6cff;
      --grad:linear-gradient(135deg,#ff8a5b 0%,#ff5e8a 55%,#a46bff 100%);
      --shadow:0 10px 30px rgba(180,110,80,.12);--ok:#2bb673;--bad:#e5484d;
    }
    @media (prefers-color-scheme:dark){:root{
      color-scheme:dark;
      --bg:#1d1520;--blob1:#4a2433;--blob2:#2e2350;
      --card:#271d2b;--soft:#30253a;--line:#3a2e44;--text:#fbeff0;--muted:#b39fa8;
      --shadow:0 10px 30px rgba(0,0,0,.3);
    }}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--text);font:16px/1.5 Nunito,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
      background:radial-gradient(600px 400px at 10% -5%,var(--blob1),transparent 70%),radial-gradient(500px 380px at 105% 10%,var(--blob2),transparent 70%),var(--bg);background-attachment:fixed}
    main{width:min(760px,100%);margin:0 auto;padding:28px 16px 60px;display:grid;gap:18px}
    header{display:flex;align-items:center;gap:12px;padding:0 4px}
    header .logo{width:44px;height:44px;border-radius:15px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 18px rgba(255,94,138,.3);color:#fff}
    header h1{margin:0;font-size:1.6rem;font-weight:900;letter-spacing:-.01em}

    .card{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow)}

    /* Resultado */
    .hero{position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:28px;padding:24px;box-shadow:0 16px 36px rgba(255,94,138,.28)}
    .hero::after{content:"";position:absolute;width:220px;height:220px;right:-60px;top:-80px;border-radius:50%;background:rgba(255,255,255,.14)}
    .hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
    .chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:800;backdrop-filter:blur(6px)}
    .chip .dot{width:8px;height:8px;border-radius:50%;background:#fff}
    .chip.wait .dot{animation:pulse .9s infinite alternate}
    .chip.bad{background:rgba(120,0,20,.3)}
    @keyframes pulse{to{opacity:.2}}
    .big{position:relative;z-index:1;margin:18px 0 2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .big b{font-size:clamp(3rem,12vw,4.2rem);font-weight:900;line-height:1;letter-spacing:-.03em;display:inline-block}
    .big span{font-size:1.2rem;font-weight:800;opacity:.95}
    .sub{position:relative;z-index:1;margin:6px 0 0;font-weight:700;opacity:.9;font-size:.95rem}
    .round{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;cursor:pointer}

    .lists{display:grid;gap:10px}
    .list{display:flex;align-items:center;gap:14px;padding:6px 4px}
    .list + .list{border-top:1px solid var(--line);padding-top:16px}
    .ico{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:1.35rem}
    .ico.a{background:#ffe6dc}.ico.b{background:#ece4ff}
    @media (prefers-color-scheme:dark){.ico.a{background:#4a2c2c}.ico.b{background:#3a2e5c}}
    .list div{flex:1;min-width:0}
    .list strong{display:block;font-size:1.05rem;font-weight:800}
    .list small{color:var(--muted);font-weight:600}
    .msg{margin:0;padding:12px 16px;border-radius:16px;background:rgba(229,72,77,.1);color:var(--bad);font-weight:700}
    .msg:empty{display:none}
    .msg.info{background:var(--soft);color:var(--muted)}

    h2{margin:6px 6px -4px;font-size:1.1rem;font-weight:900}

    .sources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
    .src-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .src-head h3{margin:0;font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:9px}
    .num{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:.85rem;font-weight:900}
    .seg{position:relative;display:inline-flex;background:var(--soft);border-radius:999px;padding:4px}
    .seg::before{content:"";position:absolute;top:4px;bottom:4px;left:var(--x,4px);width:var(--w,0);background:var(--card);border-radius:999px;box-shadow:0 2px 8px rgba(150,90,70,.18);transition:left .3s cubic-bezier(.3,1.3,.5,1),width .3s cubic-bezier(.3,1.3,.5,1)}
    .seg button{position:relative;z-index:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.85rem;font-weight:800;padding:6px 14px;cursor:pointer;border-radius:999px}
    .seg button.active{color:var(--text)}
    input[type=url],input[type=password],textarea{width:100%;border:2px solid transparent;background:var(--soft);color:var(--text);border-radius:16px;padding:13px 15px;font:inherit;font-size:.92rem;font-weight:600;outline:none;transition:border-color .2s,background .2s}
    input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
    input[type=url]{text-overflow:ellipsis}
    textarea{height:160px;resize:vertical;line-height:1.45}
    input:focus,textarea:focus{border-color:var(--coral);background:var(--card)}
    textarea.drag{border-style:dashed;border-color:var(--violet)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:.88rem;color:var(--muted);font-weight:700}
    .hidden{display:none!important}

    button.pill{border:0;border-radius:999px;background:var(--soft);color:var(--text);font:inherit;font-size:.88rem;font-weight:800;padding:9px 16px;cursor:pointer;white-space:nowrap}
    button.pill.done{background:var(--ok);color:#fff}

    details summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-weight:800}
    details summary::-webkit-details-marker{display:none}
    details summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .25s}
    details[open] summary::after{transform:rotate(-135deg)}
    details[open] summary{margin-bottom:14px}
    .token-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.88rem;font-weight:700;color:var(--muted)}
    .token-row label{display:flex;align-items:center;gap:7px;cursor:pointer}
    .token-row input{accent-color:var(--coral);width:17px;height:17px}
    .token-row a{margin-left:auto;color:var(--coral);text-decoration:none}

    .primary{position:relative;overflow:hidden;width:100%;border:0;border-radius:999px;background:var(--grad);background-size:160% 100%;color:#fff;font:inherit;font-size:1.1rem;font-weight:900;padding:18px;cursor:pointer;box-shadow:0 12px 28px rgba(255,94,138,.35)}

    /* ---------- Animaciones ---------- */
    button{-webkit-tap-highlight-color:transparent;transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .25s,background-position .4s,color .2s,box-shadow .25s,opacity .2s}
    button:active:not(:disabled){transform:scale(.93)}
    button.pill:hover{transform:translateY(-2px);background:var(--line)}
    button.pill.done{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
    @keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
    .round:hover{background:rgba(255,255,255,.35);transform:rotate(-45deg)}
    .round.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .seg button:hover:not(.active){color:var(--text)}
    .primary:hover:not(:disabled){transform:translateY(-3px);background-position:100% 0;box-shadow:0 18px 36px rgba(255,94,138,.42)}
    .primary:active:not(:disabled){transform:translateY(0) scale(.97)}
    .primary:disabled{cursor:progress}
    .primary.busy::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.4) 50%,transparent 80%);transform:translateX(-100%);animation:shimmer 1.2s infinite}
    @keyframes shimmer{to{transform:translateX(100%)}}
    .primary.success{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
    @keyframes jump{30%{transform:scale(1.05)}60%{transform:scale(.98)}}
    .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
    @keyframes ripple{to{transform:scale(1);opacity:0}}
    .bump{animation:bump .55s cubic-bezier(.3,1.6,.5,1)}
    @keyframes bump{0%{transform:scale(.85);opacity:.4}100%{transform:scale(1);opacity:1}}
    .card,.hero{animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
    main>:nth-child(3){animation-delay:.05s}main>:nth-child(5){animation-delay:.1s}main>:nth-child(6){animation-delay:.15s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
    @media(max-width:640px){.sources{grid-template-columns:1fr}.hero{padding:20px}}
  </style>
</head>
<body>
<main>
  <header>
    <span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="m8 2 4 4 4-4"/></svg></span>
    <h1>Mis listas</h1>
  </header>

  <section class="hero" aria-live="polite">
    <div class="hero-top">
      <span class="chip" id="badge"><span class="dot"></span><span>Cargando…</span></span>
      <button class="round" id="refresh" title="Actualizar" aria-label="Actualizar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
    </div>
    <div class="big"><b id="unique">—</b><span>canales</span></div>
    <p class="sub" id="sub">&nbsp;</p>
  </section>

  <section class="card lists" id="outputs"></section>
  <p class="msg" id="message"></p>

  <h2>Listas de origen</h2>
  <section class="sources" id="sources"></section>

  <details class="card" id="token-box">
    <summary>🔑 Clave de GitHub</summary>
    <input id="token" type="password" autocomplete="off" placeholder="Pega tu clave aquí" spellcheck="false">
    <div class="token-row">
      <label><input id="remember" type="checkbox" checked> Recordar</label>
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noreferrer">Crear clave</a>
    </div>
  </details>

  <button class="primary" id="publish">Juntar y publicar</button>
</main>
<script>
const OWNER='ivanmi2005',REPO='crispy-robot',BRANCH='main';
const PAGES_BASE=`https://${OWNER}.github.io/${REPO}`;
const RAW_BASE=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;
const MAX_BYTES=950000;
const DEFAULT_URLS=['https://tokyo.elcano-ipfs.workers.dev/k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb/data/listas/lista_fuera_iptv.m3u','https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u'];
const OUTPUTS=[
  {name:'AceStream',hint:'Para la app',icon:'📺',cls:'a',file:'lista_acestream_unificada.m3u'},
  {name:'Motor local',hint:'Para el ordenador',icon:'💻',cls:'b',file:'lista_local_unificada.m3u'}
];
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
const plural=(n,one,many)=>`${Number(n).toLocaleString('es-ES')} ${n===1?one:many}`;

/* ---------- Listas de origen ---------- */
function moveSeg(card){const seg=card.querySelector('.seg'),a=seg.querySelector('.active');if(!a)return;seg.style.setProperty('--x',a.offsetLeft+'px');seg.style.setProperty('--w',a.offsetWidth+'px')}
window.addEventListener('resize',()=>document.querySelectorAll('[data-i]').forEach(moveSeg));
document.fonts?.ready.then(()=>document.querySelectorAll('[data-i]').forEach(moveSeg));
let saved=[];try{saved=JSON.parse(store.get('crispySources')||'[]')}catch{}
const state=[0,1].map(i=>({mode:saved[i]?.mode==='text'?'text':'url',url:saved[i]?.url||DEFAULT_URLS[i],fileName:null,loadedText:null}));
function saveSources(){store.set('crispySources',JSON.stringify(state.map(s=>({mode:s.mode,url:s.url}))))}
function countIds(text){const ids=new Set();for(const m of text.matchAll(/(?<![0-9a-f])([0-9a-f]{40})(?![0-9a-f])/gi))ids.add(m[1].toLowerCase());return ids.size}

$('#sources').innerHTML=state.map((s,i)=>`
  <article class="card" data-i="${i}">
    <div class="src-head"><h3><span class="num">${i+1}</span>Lista ${i+1}</h3>
      <div class="seg"><button data-mode="url">Enlace</button><button data-mode="text">Texto</button></div></div>
    <div data-panel="url"><input type="url" spellcheck="false" placeholder="Pega el enlace de la lista"></div>
    <div data-panel="text">
      <textarea spellcheck="false" placeholder="Pega aquí el contenido de la lista"></textarea>
      <div class="row"><span data-count>Sin canales todavía</span><button class="pill" data-open>📂 Abrir archivo</button></div>
      <input type="file" accept=".m3u,.m3u8,.txt,text/plain" hidden>
    </div>
  </article>`).join('');

document.querySelectorAll('[data-i]').forEach(card=>{
  const s=state[+card.dataset.i];
  const url=card.querySelector('input[type=url]'),ta=card.querySelector('textarea'),file=card.querySelector('input[type=file]'),count=card.querySelector('[data-count]');
  const setMode=m=>{s.mode=m;card.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));card.querySelectorAll('[data-panel]').forEach(p=>p.classList.toggle('hidden',p.dataset.panel!==m));moveSeg(card);saveSources()};
  const updateCount=()=>{const n=countIds(ta.value);count.textContent=n?`✅ ${plural(n,'canal','canales')}`:'Sin canales todavía'};
  const loadFile=async f=>{if(!f)return;s.fileName=f.name;s.loadedText=ta.value=await f.text();updateCount()};
  url.value=s.url;url.addEventListener('input',()=>{s.url=url.value.trim();saveSources()});
  card.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
  ta.addEventListener('input',updateCount);
  card.querySelector('[data-open]').addEventListener('click',()=>file.click());
  file.addEventListener('change',()=>{loadFile(file.files[0]);file.value=''});
  ta.addEventListener('dragover',e=>{e.preventDefault();ta.classList.add('drag')});
  ta.addEventListener('dragleave',()=>ta.classList.remove('drag'));
  ta.addEventListener('drop',e=>{e.preventDefault();ta.classList.remove('drag');loadFile(e.dataTransfer.files[0])});
  s.textarea=ta;setMode(s.mode);
});

/* ---------- Clave ---------- */
const tokenEl=$('#token'),rememberEl=$('#remember');
const savedToken=store.get('crispyGithubToken');
if(savedToken)tokenEl.value=savedToken;else $('#token-box').open=true;

/* ---------- Resultado ---------- */
function setBadge(kind,text){const b=$('#badge');b.className=`chip ${kind}`;b.lastElementChild.textContent=text}
function setMessage(text,info=false){const m=$('#message');m.textContent=text||'';m.className=`msg${info?' info':''}`}
function renderOutputs(){
  $('#outputs').innerHTML=OUTPUTS.map(o=>`<div class="list"><span class="ico ${o.cls}">${o.icon}</span><div><strong>${o.name}</strong><small>${o.hint}</small></div><button class="pill" data-copy="${PAGES_BASE}/${o.file}">Copiar</button></div>`).join('');
  $('#outputs').querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='¡Copiado!';b.classList.add('done')}catch{b.textContent='No se pudo'}setTimeout(()=>{b.textContent='Copiar';b.classList.remove('done')},1500)}));
}
function fmtDate(iso){const d=new Date(iso);if(isNaN(d))return'';const t=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});const days=Math.round((new Date().setHours(0,0,0,0)-new Date(d).setHours(0,0,0,0))/864e5);return days===0?`Hoy, ${t}`:days===1?`Ayer, ${t}`:`${d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}, ${t}`}
function renderStatus(st){
  const el=$('#unique'),t=st.total_unique==null?'—':Number(st.total_unique).toLocaleString('es-ES');
  if(el.textContent!==t){el.textContent=t;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
  $('#sub').textContent=st.total_duplicates!=null?`${plural(st.total_duplicates,'repetido quitado','repetidos quitados')}`:' ';
  if(st.ok){setBadge('',fmtDate(st.generated_at));setMessage('')}
  else{setBadge('bad','Algo falló');setMessage(st.error||'El último proceso falló')}
}
async function fetchStatus(){
  const t=Date.now(),urls=[`${RAW_BASE}/published/status.json?t=${t}`,`${PAGES_BASE}/status.json?t=${t}`];
  const results=(await Promise.allSettled(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()))))
    .filter(r=>r.status==='fulfilled').map(r=>r.value);
  if(!results.length)throw new Error('Todavía no hay listas publicadas.');
  return results.sort((a,b)=>new Date(b.generated_at)-new Date(a.generated_at))[0];
}
async function loadStatus(){
  const btn=$('#refresh');btn.classList.add('spin');
  try{renderStatus(await fetchStatus())}catch(e){setBadge('bad','Sin datos');setMessage(e.message)}
  finally{btn.classList.remove('spin')}
}

/* ---------- GitHub ---------- */
function toBase64(text){const bytes=new TextEncoder().encode(text);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin)}
async function github(path,options={}){
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{...options,headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${tokenEl.value.trim()}`,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}});
  if(!r.ok){let d='';try{d=(await r.json()).message||''}catch{}if(r.status===401)throw new Error('La clave de GitHub no es válida.');throw new Error(`GitHub ${r.status}${d?`: ${d}`:''}`)}
  return r.status===204?null:r.json();
}
async function currentSha(path){try{return(await github(`${path}?ref=${BRANCH}`)).sha}catch(e){if(e.message.startsWith('GitHub 404'))return null;throw e}}
async function upsert(path,content,message){const sha=await currentSha(path),body={message,content:toBase64(content),branch:BRANCH};if(sha)body.sha=sha;return github(path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}

async function poll(requestId){
  const start=Date.now();
  while(Date.now()-start<180000){
    await new Promise(r=>setTimeout(r,4000));
    try{const st=await fetchStatus();if(st.request_id===requestId||(!st.ok&&new Date(st.generated_at)>start)){renderStatus(st);return st.ok}}catch{}
  }
  setBadge('wait','Casi listo');setMessage('Está tardando un poco. Puedes cerrar la página, los enlaces se actualizarán solos.',true);
  return false;
}

async function publish(){
  const token=tokenEl.value.trim();
  if(!token){$('#token-box').open=true;tokenEl.focus();setMessage('Falta la clave de GitHub.');return}
  store.set('crispyGithubToken',rememberEl.checked?token:null);
  const btn=$('#publish');btn.disabled=true;btn.classList.add('busy');btn.textContent='Publicando…';
  setBadge('wait','Subiendo…');setMessage('');
  try{
    const sources=[];
    for(let i=0;i<2;i++){
      const s=state[i];
      if(s.mode==='url'){
        if(!/^https?:\/\//i.test(s.url))throw new Error(`El enlace de la lista ${i+1} no es válido.`);
        sources.push({label:`Lista ${i+1}`,type:'url',url:s.url,enabled:true});
      }else{
        const text=s.textarea.value;
        if(!countIds(text))throw new Error(`La lista ${i+1} no tiene canales.`);
        if(new TextEncoder().encode(text).length>MAX_BYTES)throw new Error(`La lista ${i+1} es demasiado grande. Usa su enlace.`);
        const path=`web_sources/source_${i+1}.m3u`;
        await upsert(path,text.endsWith('\n')?text:text+'\n',`web: actualizar fuente ${i+1}`);
        sources.push({label:s.fileName&&text===s.loadedText?s.fileName:`Texto ${i+1}`,type:'file',path,enabled:true});
      }
    }
    const requestId=`${Date.now()}-${crypto.randomUUID?.()||Math.random().toString(36).slice(2)}`;
    const request={request_id:requestId,requested_at:new Date().toISOString(),sources,outputs:{acestream:OUTPUTS[0].file,local:OUTPUTS[1].file}};
    await upsert('merge_request.json',JSON.stringify(request,null,2)+'\n','web: fusionar y publicar listas M3U');
    setBadge('wait','Preparando…');
    if(await poll(requestId)){btn.classList.add('success');setTimeout(()=>btn.classList.remove('success'),800)}
  }catch(e){setBadge('bad','Algo falló');setMessage(String(e.message||e))}
  finally{btn.disabled=false;btn.classList.remove('busy');btn.textContent='Juntar y publicar'}
}

$('#publish').addEventListener('pointerdown',e=>{const b=e.currentTarget;if(b.disabled)return;const r=b.getBoundingClientRect(),size=Math.max(r.width,r.height)*2,dot=document.createElement('span');dot.className='ripple';dot.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;b.appendChild(dot);setTimeout(()=>dot.remove(),650)});
$('#publish').addEventListener('click',publish);
$('#refresh').addEventListener('click',loadStatus);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('#publish').disabled)loadStatus()});
renderOutputs();
loadStatus();
</script>
</body>
