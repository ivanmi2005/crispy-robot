name: Fusionar listas desde la web

on:
  push:
    paths:
      - "merge_request.json"
      - "merge_web.py"
      - ".github/workflows/merge-web.yml"
  workflow_dispatch:

concurrency:
  group: merge-web
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Fusionar fuentes
        run: python merge_web.py

      - name: Guardar listas estables en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar en main"
          else
            git commit -m "m3u: actualizar listas unificadas"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Preparar GitHub Pages
        run: |
          rm -rf output
          mkdir -p output
          cp web/index.html output/index.html
          cp published/* output/
          touch output/.nojekyll

      - name: Publicar web y listas en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          commit_message: "web: publicar listas unificadas"
          enable_jekyll: false
