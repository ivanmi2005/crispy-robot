name: Publicar web M3U

on:
  push:
    paths:
      - "web/**"
      - "published/**"
      - ".github/workflows/generate.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar contenido público
        run: |
          mkdir -p output
          cp web/index.html output/index.html
          if [ -d published ]; then
            cp published/* output/ 2>/dev/null || true
          fi
          touch output/.nojekyll

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          commit_message: "web: actualizar M3U Fusion"
          enable_jekyll: false
